name: Bug report
description: Something is broken or behaves wrongly
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the app\n2. Press Spin\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or recording
      description: Optional. Drag a file here.