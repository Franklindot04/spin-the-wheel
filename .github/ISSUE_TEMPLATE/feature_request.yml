name: Feature request
description: Suggest something new
title: "Feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Optional. Another site or app that does it well.